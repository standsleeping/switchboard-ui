name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `just` ships on PyPI as `rust-just`; installing it through uv avoids a
      # separate marketplace action to pin and trust.
      - name: Install just
        run: uv tool install rust-just

      # No explicit Python setup: `uv sync` provisions the interpreter from
      # .python-version / requires-python. Add a `strategy.matrix` here when
      # the template needs to test against more than one Python version.
      # `--all-packages` installs every workspace member (core, theme, showcase),
      # not just the root, so the theme gate and the showcase have what they need.
      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups --all-packages

      # Same target developers run locally, so green here means green there.
      - name: Run checks (lint, format, types, tests)
        run: just check

      # ty is Astral's pre-1.0 type checker. Kept as a supplementary signal;
      # mypy is the authoritative gate until ty reaches a stable release.
      - name: Type check (ty, non-blocking)
        run: just typecheck-ty
        continue-on-error: true

  # Separate from `check` so a browser-install failure reads as a browser
  # problem rather than a test failure, and so the fast gate stays green and
  # legible while this job is doing its slower work.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups --all-packages

      # All three engines: Blink, Gecko, and WebKit differ exactly where these
      # cases live (sticky geometry, scroll restoration timing, scrollbar
      # gutters). The gutter cases force classic bars themselves, per engine,
      # at launch; everything else runs under the platform's defaults.
      - name: Install browser engines
        run: just browser-install

      - name: Run browser regression tests
        run: just browser-test

      # The classic-scrollbar cases again, headed under a virtual display: a
      # real widget layer can present classic bars that headless rendering
      # never does, and the Firefox and WebKit gutter verdicts only exist
      # there.
      - name: Run classic-scrollbar cases headed
        run: xvfb-run --auto-servernum just classic-test

      # The classic-scrollbar cases only run on this runner (development
      # machines have overlay bars), so for them a failure here has no local
      # reproduction; the screenshot and trace are the whole report.
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results
          if-no-files-found: ignore

  # Real Safari through Apple's safaridriver, which only exists on macOS.
  # Dispatch-only: the engine under test changes on the runner image's cadence,
  # not the repository's, and macOS minutes are the expensive pool.
  safari:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install just
        run: uv tool install rust-just

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups --all-packages

      # The runner allows passwordless sudo; this is the documented switch
      # that lets safaridriver create sessions.
      - name: Enable safaridriver
        run: sudo safaridriver --enable

      - name: Run real-Safari regression tests
        run: just safari-test
